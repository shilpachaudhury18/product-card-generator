# Render Blueprint: one web service that runs the API and also serves the built client
services:
  - type: web
    name: product-card-generator
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client --include=dev && npm ci --prefix server --include=dev && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false # Render asks for this when you create the service
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
